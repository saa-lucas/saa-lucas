<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="round-corner">
      <rect width="800" height="200" rx="10" />
    </clipPath>
  </defs>

  <rect width="800" height="200" rx="10" fill="#0D1117"/>

  <g clip-path="url(#round-corner)">
    <path d="M-400 150C-200 140 0 170 200 150C400 130 600 160 800 150C1000 140 1200 170 1400 150V200H-400V150Z" fill="#004E92" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" from="0" to="400" dur="12s" repeatCount="indefinite" />
    </path>

    <path d="M-400 165C-200 155 0 185 200 165C400 145 600 175 800 165C1000 155 1200 185 1400 165V200H-400V165Z" fill="#0077B5" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="0" to="400" dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" 
        font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace" 
        font-size="70" font-weight="800" letter-spacing="-2" fill="#0077B5">Lucas Sá</text>
</svg>
