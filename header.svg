<svg width="800" height="150" viewBox="0 0 800 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="round-corner">
      <rect width="800" height="150" rx="10" />
    </clipPath>
  </defs>

  <rect width="800" height="150" rx="10" fill="#0D1117"/>

  <g clip-path="url(#round-corner)">
    <path d="M-400 100C-200 90 0 120 200 100C400 80 600 110 800 100C1000 90 1200 120 1400 100V150H-400V100Z" fill="#004E92" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" from="0" to="400" dur="12s" repeatCount="indefinite" />
    </path>

    <path d="M-400 115C-200 105 0 135 200 115C400 95 600 125 800 115C1000 105 1200 135 1400 115V150H-400V115Z" fill="#0077B5" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="0" to="400" dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" 
        font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" 
        font-size="65" font-weight="800" letter-spacing="-2" fill="#0077B5">Lucas Sá</text>
</svg>
