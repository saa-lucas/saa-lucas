<svg width="800" height="150" viewBox="0 0 800 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="round-corner">
      <rect width="800" height="150" rx="10" />
    </clipPath>
    
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0077B5" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite" />
      </circle>
    </pattern>
  </defs>

  <rect width="800" height="150" rx="10" fill="#0D1117"/>
  <rect width="800" height="150" fill="url(#dotGrid)" clip-path="url(#round-corner)"/>

  <g clip-path="url(#round-corner)">
    <path d="M-800 100C-600 90 -400 120 -200 100C0 80 200 110 400 100C600 90 800 120 1000 100C1200 80 1400 110 1600 100V150H-800V100Z" fill="#004E92" opacity="0.2">
      <animateTransform attributeName="transform" type="translate" from="0" to="800" dur="15s" repeatCount="indefinite" />
    </path>

    <path d="M-800 115C-600 105 -400 135 -200 115C0 95 200 125 400 115C600 105 800 135 1000 115C1200 95 1400 125 1600 115V150H-800V115Z" fill="#0077B5" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="0" to="800" dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" 
        font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" 
        font-size="65" font-weight="800" letter-spacing="-2" fill="#0077B5" style="text-shadow: 0px 0px 10px rgba(0, 119, 181, 0.3);">
    Lucas Sá
  </text>
</svg>
