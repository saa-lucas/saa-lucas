<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="round-corner">
      <rect width="800" height="200" rx="10" />
    </clipPath>
  </defs>

  <rect width="800" height="200" rx="10" fill="#0D1117"/>

  <g clip-path="url(#round-corner)">
    <path d="M-400 150C-200 140 0 170 200 150C400 130 600 160 800 150C1000 140 1200 170 1400 150V200H-400V150Z" fill="#004E92" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" from="0" to="400" dur="10s" repeatCount="indefinite" />
    </path>

    <path d="M-400 170C-200 160 0 190 200 170C400 150 600 180 800 170C1000 160 1200 190 1400 170V200H-400V170Z" fill="#0077B5">
      <animateTransform attributeName="transform" type="translate" from="0" to="400" dur="6s" repeatCount="indefinite" />
    </path>
  </g>

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="55" font-weight="bold" fill="#0077B5">Lucas Sá</text>
</svg>
