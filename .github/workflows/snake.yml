name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#444c56,#6e7681,#9ca5b1,#ffffff
            dist/snake-soft-dark.svg?color_snake=#ffffff&color_dots=#161b22,#444c56,#6e7681,#9ca5b1,#ffffff&color_bg=#212830
            dist/snake-light.svg?color_snake=#000000&color_dots=#ebedf0,#d1d5da,#959da5,#586069,#000000
            
      - name: push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
